[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redscribe"
dynamic = ["version"]
description = "A lightweight, local-first notebook for CTFs, pentests, and security research."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RedScribe contributors" }]
keywords = ["ctf", "pentest", "notebook", "security", "markdown", "tkinter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.gui-scripts]
redscribe = "redscribe.app:main"

[project.urls]
Documentation = "https://github.com/yassinalkhulaqi/Cipher-CTF-notes#readme"
Issues = "https://github.com/yassinalkhulaqi/Cipher-CTF-notes/issues"

[tool.setuptools.dynamic]
version = { attr = "redscribe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redscribe = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "gui: tests that create a Tk window (skipped without a display)",
]

[tool.coverage.run]
branch = true
source = ["redscribe"]
omit = ["*/redscribe/ui/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "SIM", "PT", "RUF"]
ignore = ["A003", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001", "DTZ005", "PT011"]
"src/redscribe/content/highlight.py" = ["E501"]
"src/redscribe/content/markdown.py" = ["E501"]
"src/redscribe/content/snippets.py" = ["E501"]
"src/redscribe/services/exporter.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src"]
