name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: CLI smoke test
        run: |
          python -m redscribe --version
          python -m redscribe doctor --vault "${{ runner.temp }}/redscribe-cli.db" --json
          python -m redscribe stats --vault "${{ runner.temp }}/redscribe-cli.db" --json
          python -m redscribe migrate --vault "${{ runner.temp }}/redscribe-cli.db" --json
          python -m redscribe backup --vault "${{ runner.temp }}/redscribe-cli.db" --destination "${{ runner.temp }}/redscribe-cli-backup.db" --json
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        run: python -m pytest --cov=redscribe --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend format, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Format check
        run: npm run format:check --prefix frontend
      - name: Tests
        run: npm test --prefix frontend
      - name: Build
        run: npm run build --prefix frontend
      - name: Committed bundle is up to date
        run: git diff --exit-code -- src/redscribe/ui/web/static
      - name: Audit
        run: npm audit --prefix frontend --audit-level=high --omit=dev

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install and smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import redscribe; print(redscribe.__version__)"
          /tmp/smoke/bin/redscribe --version
          /tmp/smoke/bin/redscribe-cli doctor --vault /tmp/smoke/cli.db --json
          /tmp/smoke/bin/python scripts/smoke_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
